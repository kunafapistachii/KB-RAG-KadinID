<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Review — {{ citation }}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; }
    .wrap { display: flex; height: 100vh; }
    .pane { padding: 20px; overflow-y: auto; }
    .pdf-pane { flex: 1.1; background: #eee; text-align: center; }
    .pdf-pane img { max-width: 100%; border: 1px solid #ccc; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .form-pane { flex: 1; border-left: 1px solid #ddd; }
    h2 { font-size: 1rem; margin: 0 0 4px; }
    .meta { color: #666; font-size: 0.85rem; margin-bottom: 16px; }
    .remaining { float: right; background: #b91c1c; color: white; padding: 2px 10px; border-radius: 10px; font-size: 0.8rem; }
    textarea { width: 100%; height: 260px; font-family: ui-monospace, monospace; font-size: 0.9rem;
               box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    .actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    button { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.9rem; }
    .save { background: #2563eb; color: white; }
    .keep { background: #15803d; color: white; }
    .skip { background: #6b7280; color: white; }
    .delete { background: #b91c1c; color: white; }
    form { display: inline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="pane pdf-pane">
      {% for p in range(page_start, page_end + 1) %}
        <img src="/page-image/{{ source_file }}/{{ p }}" alt="page {{ p }}">
      {% endfor %}
    </div>
    <div class="pane form-pane">
      <span class="remaining">{{ remaining }} left</span>
      <h2>{{ citation }}</h2>
      <div class="meta">pages {{ page_start }}–{{ page_end }} &middot; chunk_id={{ chunk_id }}</div>

      <form method="post" action="/review/{{ doc_id }}/{{ chunk_id }}/save">
        <textarea name="text">{{ text }}</textarea>
        <div class="actions">
          <button type="submit" class="save">Save correction (re-embeds)</button>
        </div>
      </form>

      <div class="actions">
        <form method="post" action="/review/{{ doc_id }}/{{ chunk_id }}/keep">
          <button type="submit" class="keep">Keep as-is</button>
        </form>
        <form method="post" action="/review/{{ doc_id }}/{{ chunk_id }}/skip">
          <button type="submit" class="skip">Skip for now</button>
        </form>
        <form method="post" action="/review/{{ doc_id }}/{{ chunk_id }}/delete"
              onsubmit="return confirm('Delete this chunk permanently?');">
          <button type="submit" class="delete">Delete chunk</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
